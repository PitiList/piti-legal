<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legal · Piti</title>
<style>
:root { --primary:#012d1d; --secondary:#006c48; --surface:#f6fbf5; --card:#ffffff; --ink:#181d1a; --muted:#414844; --line:#dfe4df; --chip:#c1ecd4; }
@media (prefers-color-scheme: dark) {
  :root { --primary:#a5d0b9; --secondary:#75daa8; --surface:#0f1512; --card:#161d19; --ink:#dfe4df; --muted:#c1c8c2; --line:#2e3833; --chip:#274e3c; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--surface); color:var(--ink); font:16px/1.65 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust:100%; }
header { background:var(--primary); color:#fff; padding:28px 20px 22px; }
@media (prefers-color-scheme: dark) { header { background:#1b4332; } }
header .brand { font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.8; font-weight:600; }
header nav { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
header nav a { color:#fff; text-decoration:none; font-size:14px; font-weight:600; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.14); }
header nav a.on { background:#92f7c3; color:#002113; }
main { max-width:760px; margin:-10px auto 40px; padding:0 16px; }
article { background:var(--card); border-radius:16px; padding:24px 20px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
h1 { font-size:26px; line-height:1.25; color:var(--primary); margin:0 0 6px; }
h2 { font-size:19px; color:var(--primary); margin:30px 0 8px; padding-top:14px; border-top:1px solid var(--line); }
h3 { font-size:16px; color:var(--secondary); margin:20px 0 6px; }
p, li { color:var(--muted); }
strong { color:var(--ink); }
a { color:var(--secondary); }
code { background:var(--chip); color:var(--ink); padding:1px 6px; border-radius:6px; font-size:14px; }
table { width:100%; border-collapse:collapse; margin:12px 0; font-size:14px; display:block; overflow-x:auto; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--primary); }
footer { text-align:center; font-size:13px; color:var(--muted); padding:0 16px 32px; }
</style>
</head>
<body>
<header>
  <div class="brand">Piti · Field Survey Journal</div>
  <nav>
    <a href="piti/terms/" class="">Terms of Use</a>
    <a href="piti/privacy/" class="">Privacy Policy</a>
  </nav>
</header>
<main><article>
<h1>Piti Legal</h1>
<p>Legal documents for the Piti iOS app.</p>
<ul>
  <li><a href="piti/terms/">Terms of Use</a></li>
  <li><a href="piti/privacy/">Privacy Policy</a></li>
</ul>
</article></main>
<footer>Contact: <a href="mailto:PitiList@gmail.com">PitiList@gmail.com</a></footer>
</body>
</html>
